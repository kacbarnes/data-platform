[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-lake-cli"
version = "0.1.0"
description = "Contract-driven local research lakehouse operations"
requires-python = ">=3.13"
dependencies = ["duckdb==1.5.5", "PyYAML>=6.0", "pytz>=2025.2"]

[project.scripts]
lake = "lake_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
