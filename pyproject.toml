[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "research-lake-cli"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Contract-driven local research lakehouse operations"
requires-python = ">=3.13"
dependencies = ["duckdb==1.5.5", "duckdb-cli==1.5.5", "PyYAML>=6.0", "pytz>=2025.2"]

[project.optional-dependencies]
podman = ["podman-compose==1.6.0"]

[project.scripts]
lake = "lake_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lake_cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
